<!DOCTYPE html>

<!--语言-->
<html lang="zh-cn">

<head>
    <!--网页标题-->
    <title data-i18n="status.pageTitle">EFH - 服务状态</title>

    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1, shrink-to-fit=no" name="viewport"/>
    <link href="/woznes.png" rel="icon" type="image/png"/>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"/>

    <script src="/js/i18n.js" defer></script>
    <link href="/css/common.css" rel="stylesheet">
    <link href="/css/bootstrap4.centos.css" rel="stylesheet">
    <script>
        $(document).ready(function () {
            $("#footer").load("/footer.html");
            $("#navibar").load("/navibar.html");
        })
    </script>
</head>

<body>
<div id="navibar"></div>
<header class="header header__page">

    <!--logo-->
    <div class="container mb-5">
        <a href="/static"></a>
    </div>

    <!--页面标题-->
    <h1 class="header__page__title" data-i18n="status.heading">
        在写了
    </h1>

    <!--副标题-->
    <p class="header__page__description" data-i18n="status.subtitle">
        在写了在写了
    </p>

</header>

<!--装饰线条-->
<div class="hr">
    <div class="hr__centos-color-0"></div>
    <div class="hr__centos-color-1"></div>
    <div class="hr__centos-color-2"></div>
    <div class="hr__centos-color-3"></div>
</div>

<!--内容-->
<main class="page">
    <article class="page__content">
        <!--添加一个row来添加新的内容-->
        <!--并填充col-->
        <!--每段使用<p> -->
        <!--内容标题使用h5-->
        <!--内容副标题使用h6-->
        <!--使用<div class="alert alert-info" role="alert">创建重要信息框-->
        <!--使用<h5 class="alert-heading"></h5>作为重要标题-->
        <div class="row">
            <div class="col">
                <button id="refreshBtn" class="btn btn-primary" data-i18n="status.refresh">刷新</button>
                <span id="updated" class="ml-2"></span>
            </div>
        </div>
        <div class="row mt-3">
            <div class="col">
                <div class="table-responsive">
                    <table class="table table-bordered table-striped">
                        <thead>
                        <tr>
                            <th data-i18n="status.node">节点</th>
                            <th data-i18n="status.delay">延迟</th>
                            <th data-i18n="status.state">状态</th>
                        </tr>
                        </thead>
                        <tbody id="nodeBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </article>
</main>

<!--装饰线条-->
<div class="hr">
    <div class="hr__centos-color-0"></div>
    <div class="hr__centos-color-1"></div>
    <div class="hr__centos-color-2"></div>
    <div class="hr__centos-color-3"></div>
</div>

<!--页脚-->
<div id="footer"></div>

<script>
    (function () {
        "use strict";

        var body = document.getElementById("nodeBody");
        var updated = document.getElementById("updated");
        var refreshBtn = document.getElementById("refreshBtn");
        var loading = false;
        var nodes = [];
        var updatedAt = null;

        function delayText(node) {
            if (node.reachable && node.delay) {
                return node.delay + " ms";
            }
            return node.message || "-";
        }

        function nextRefresh() {
            if (updatedAt) {
                updated.textContent = i18n.t("status.updated", {time: new Date(updatedAt).toLocaleString()});
            }
        }

        function render() {
            body.innerHTML = "";
            nodes.forEach(function (node) {
                var tr = document.createElement("tr");
                var tdName = document.createElement("td");
                tdName.textContent = node.name;
                var tdDelay = document.createElement("td");
                tdDelay.textContent = delayText(node);
                var tdState = document.createElement("td");
                var badge = document.createElement("span");
                badge.className = "badge badge-" + (node.reachable ? "success" : "danger");
                badge.textContent = i18n.t(node.reachable ? "status.reachable" : "status.unreachable");
                tdState.appendChild(badge);
                tr.appendChild(tdName);
                tr.appendChild(tdDelay);
                tr.appendChild(tdState);
                body.appendChild(tr);
            });
        }

        function load() {
            if (loading) {
                return;
            }
            loading = true;
            refreshBtn.disabled = true;
            updated.textContent = i18n.t("status.testing");
            fetch("/status/nodes", {cache: "no-store"})
                .then(function (res) {
                    if (!res.ok) {
                        throw new Error("HTTP " + res.status);
                    }
                    return res.json();
                })
                .then(function (data) {
                    nodes = data.nodes || [];
                    updatedAt = data.updatedAt || Date.now();
                    render();
                    nextRefresh();
                })
                .catch(function (err) {
                    updated.textContent = i18n.t("status.failed", {msg: err && err.message ? err.message : err});
                })
                .finally(function () {
                    loading = false;
                    refreshBtn.disabled = false;
                });
        }

        refreshBtn.addEventListener("click", load);
        document.addEventListener("i18n:changed", function () {
            render();
            nextRefresh();
        });

        load();
        setInterval(load, 30000);
    })();
</script>
</body>

</html>
