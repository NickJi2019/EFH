<!DOCTYPE html>

<!--语言-->
<html lang="zh-cn">

<head>
    <!--网页标题-->
    <title data-i18n="status.pageTitle">EFH - 服务状态</title>

    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1, shrink-to-fit=no" name="viewport"/>
    <link href="/woznes.png" rel="icon" type="image/png"/>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"/>

    <script src="/js/i18n.js" defer></script>
    <link href="/css/common.css" rel="stylesheet">
    <link href="/css/bootstrap4.centos.css" rel="stylesheet">
    <style>
        /* 纯 CSS 转圈：不依赖图片，颜色跟随按钮文字 */
        .btn-spinner {
            display: inline-block;
            width: 1em;
            height: 1em;
            margin-right: .45em;
            border: 2px solid currentColor;
            border-right-color: transparent;
            border-radius: 50%;
            vertical-align: -.15em;
            animation: btn-spin .7s linear infinite;
        }

        @keyframes btn-spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
    <script>
        $(document).ready(function () {
            $("#footer").load("/footer.html");
            $("#navibar").load("/navibar.html");
        })
    </script>
</head>

<body>
<div id="navibar"></div>
<header class="header header__page">

    <!--logo-->
    <div class="container mb-5">
        <a href="/static"></a>
    </div>

    <!--页面标题-->
    <h1 class="header__page__title" data-i18n="status.heading">
        在写了
    </h1>

    <!--副标题-->
    <p class="header__page__description" data-i18n="status.subtitle">
        在写了在写了
    </p>

</header>

<!--装饰线条-->
<div class="hr">
    <div class="hr__centos-color-0"></div>
    <div class="hr__centos-color-1"></div>
    <div class="hr__centos-color-2"></div>
    <div class="hr__centos-color-3"></div>
</div>

<!--内容-->
<main class="page">
    <article class="page__content">
        <!--添加一个row来添加新的内容-->
        <!--并填充col-->
        <!--每段使用<p> -->
        <!--内容标题使用h5-->
        <!--内容副标题使用h6-->
        <!--使用<div class="alert alert-info" role="alert">创建重要信息框-->
        <!--使用<h5 class="alert-heading"></h5>作为重要标题-->
        <div class="row">
            <div class="col">
                <button id="refreshBtn" class="btn btn-primary">
                    <span id="loadingSpinner" class="btn-spinner" hidden></span>
                    <span id="refreshLabel">刷新</span>
                </button>
                <span id="updated" class="ml-2"></span>
            </div>
        </div>
        <div class="row mt-3">
            <div class="col">
                <div class="table-responsive">
                    <table class="table table-bordered table-striped">
                        <thead>
                        <tr>
                            <th data-i18n="status.node">节点</th>
                            <th data-i18n="status.delay">延迟</th>
                            <th data-i18n="status.state">状态</th>
                        </tr>
                        </thead>
                        <tbody id="nodeBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </article>
</main>

<!--装饰线条-->
<div class="hr">
    <div class="hr__centos-color-0"></div>
    <div class="hr__centos-color-1"></div>
    <div class="hr__centos-color-2"></div>
    <div class="hr__centos-color-3"></div>
</div>

<!--页脚-->
<div id="footer"></div>

<script>
    (function () {
        "use strict";

        function t(key, params) {
            return (window.i18n && typeof window.i18n.t === "function") ? window.i18n.t(key, params) : key;
        }

        function now() {
            return (window.performance && typeof performance.now === "function") ? performance.now() : Date.now();
        }

        var body;
        var updated;
        var refreshBtn;
        var refreshLabel;
        var spinner;
        var loading = false;
        var nodes = [];           // [{name, address}]
        var serverResults = {};   // 服务器侧：name -> {reachable, delay, message}
        var browserResults = {};  // 浏览器侧：name -> {reachable, delay}
        var updatedAt = null;

        // 延迟由浏览器 JS 直接探测节点服务器得到
        function delayText(node) {
            var browser = browserResults[node.name];
            if (browser && browser.reachable && browser.delay != null) {
                return browser.delay + " ms";
            }
            return "-";
        }

        function refreshUpdated() {
            if (updatedAt) {
                updated.textContent = t("status.updated", {time: new Date(updatedAt).toLocaleString()});
            }
        }

        function setLoading(on) {
            loading = on;
            refreshBtn.disabled = on;
            spinner.hidden = !on;
            refreshLabel.textContent = on ? t("status.testing") : t("status.refresh");
        }

        // 状态徽章：一个表示“从该浏览器是否可达”，一个表示“从该服务器是否可达”
        function stateBadge(labelKey, result) {
            var cls, key;
            if (!result) {
                cls = "secondary";
                key = "status.pending";
            } else if (result.reachable) {
                cls = "success";
                key = "status.reachable";
            } else {
                cls = "danger";
                key = "status.unreachable";
            }
            var badge = document.createElement("span");
            badge.className = "badge badge-" + cls;
            badge.textContent = t(labelKey) + " " + t(key);
            if (result && result.message) {
                badge.title = result.message;
            }
            return badge;
        }

        function render() {
            body.innerHTML = "";
            nodes.forEach(function (node) {
                var tr = document.createElement("tr");
                var tdName = document.createElement("td");
                tdName.textContent = node.name;
                var tdDelay = document.createElement("td");
                tdDelay.textContent = delayText(node);
                var tdState = document.createElement("td");
                var browserBadge = stateBadge("status.browser", browserResults[node.name]);
                browserBadge.className += " mr-1";
                var serverBadge = stateBadge("status.server", serverResults[node.name]);
                tdState.appendChild(browserBadge);
                tdState.appendChild(serverBadge);
                tr.appendChild(tdName);
                tr.appendChild(tdDelay);
                tr.appendChild(tdState);
                body.appendChild(tr);
            });
        }

        function fetchNodes(test) {
            var url = test ? "/status/nodes" : "/status/nodes?test=false";
            return fetch(url, {cache: "no-store"}).then(function (res) {
                if (!res.ok) {
                    throw new Error("HTTP " + res.status);
                }
                return res.json();
            });
        }

        // 浏览器直接向节点服务器发起请求，测量往返延迟并判断可达性
        function timeFetch(url) {
            var start = now();
            return fetch(url, {mode: "no-cors", cache: "no-store"}).then(function () {
                return {reachable: true, delay: Math.max(1, Math.round(now() - start))};
            }, function () {
                return {reachable: false, delay: null};
            });
        }

        function probeNode(node) {
            if (!node.address) {
                browserResults[node.name] = {reachable: false, delay: null, message: "no address"};
                render();
                return Promise.resolve();
            }
            var url = "https://" + node.address + "/?probe=" + Date.now();
            // 先预热一次（完成 TCP/TLS 握手），再测量往返延迟
            return timeFetch(url).then(function () {
                return timeFetch(url + "&t=" + Date.now());
            }).then(function (result) {
                browserResults[node.name] = result;
                render();
            });
        }

        function loadPending() {
            fetchNodes(false).then(function (data) {
                nodes = data.nodes || [];
                serverResults = {};
                browserResults = {};
                updatedAt = null;
                updated.textContent = "";
                render();
            }).catch(function (err) {
                updated.textContent = t("status.failed", {msg: err && err.message ? err.message : err});
            });
        }

        function ensureNodes() {
            if (nodes.length) {
                return Promise.resolve(nodes);
            }
            return fetchNodes(false).then(function (data) {
                nodes = data.nodes || [];
                render();
                return nodes;
            });
        }

        function runTest() {
            if (loading) {
                return;
            }
            setLoading(true);
            updated.textContent = t("status.testing");
            serverResults = {};
            browserResults = {};
            updatedAt = null;
            render();

            // 服务器侧：通过 mihomo 检测节点可达性（不用于展示延迟）
            var serverPromise = fetchNodes(true).then(function (data) {
                (data.nodes || []).forEach(function (node) {
                    serverResults[node.name] = node;
                });
                updatedAt = data.updatedAt || Date.now();
                render();
            }).catch(function (err) {
                updated.textContent = t("status.failed", {msg: err && err.message ? err.message : err});
            });

            // 浏览器侧：直接探测节点，得到浏览器到服务器的延迟与可达性
            var browserPromise = ensureNodes().then(function (list) {
                return Promise.all(list.map(probeNode));
            }).catch(function () {
            });

            Promise.all([serverPromise, browserPromise]).then(function () {
                setLoading(false);
                refreshUpdated();
            });
        }

        function start() {
            body = document.getElementById("nodeBody");
            updated = document.getElementById("updated");
            refreshBtn = document.getElementById("refreshBtn");
            refreshLabel = document.getElementById("refreshLabel");
            spinner = document.getElementById("loadingSpinner");
            refreshBtn.addEventListener("click", runTest);
            document.addEventListener("i18n:ready", function () {
                render();
                refreshUpdated();
                setLoading(loading);
            });
            document.addEventListener("i18n:changed", function () {
                render();
                refreshUpdated();
                setLoading(loading);
            });
            setLoading(false);
            loadPending();
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", start);
        } else {
            start();
        }
    })();
</script>
</body>

</html>
