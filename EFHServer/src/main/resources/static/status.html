<!DOCTYPE html>

<!--语言-->
<html lang="zh-cn">

<head>
    <!--网页标题-->
    <title data-i18n="status.pageTitle">EFH - 服务状态</title>

    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1, shrink-to-fit=no" name="viewport"/>
    <link href="/woznes.png" rel="icon" type="image/png"/>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"/>

    <script src="/js/i18n.js" defer></script>
    <link href="/css/common.css" rel="stylesheet">
    <link href="/css/bootstrap4.centos.css" rel="stylesheet">
    <style>
        /* 按钮内加载动画：放大原图后裁剪，显示清晰的 18px 转圈 */
        .btn-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            margin-right: .4em;
            overflow: hidden;
            position: relative;
            vertical-align: -.2em;
        }

        .btn-spinner img {
            position: absolute;
            width: 86px;
            height: auto;
            left: -34px;
            top: -19px;
            /* 原图白底：反相后用 screen 混合，白底消失、圆点变浅，贴合按钮 */
            filter: invert(1);
            mix-blend-mode: screen;
        }
    </style>
    <script>
        $(document).ready(function () {
            $("#footer").load("/footer.html");
            $("#navibar").load("/navibar.html");
        })
    </script>
</head>

<body>
<div id="navibar"></div>
<header class="header header__page">

    <!--logo-->
    <div class="container mb-5">
        <a href="/static"></a>
    </div>

    <!--页面标题-->
    <h1 class="header__page__title" data-i18n="status.heading">
        在写了
    </h1>

    <!--副标题-->
    <p class="header__page__description" data-i18n="status.subtitle">
        在写了在写了
    </p>

</header>

<!--装饰线条-->
<div class="hr">
    <div class="hr__centos-color-0"></div>
    <div class="hr__centos-color-1"></div>
    <div class="hr__centos-color-2"></div>
    <div class="hr__centos-color-3"></div>
</div>

<!--内容-->
<main class="page">
    <article class="page__content">
        <!--添加一个row来添加新的内容-->
        <!--并填充col-->
        <!--每段使用<p> -->
        <!--内容标题使用h5-->
        <!--内容副标题使用h6-->
        <!--使用<div class="alert alert-info" role="alert">创建重要信息框-->
        <!--使用<h5 class="alert-heading"></h5>作为重要标题-->
        <div class="row">
            <div class="col">
                <button id="refreshBtn" class="btn btn-primary">
                    <span id="loadingSpinner" class="btn-spinner" hidden><img alt="" src="/icon/loading.gif"></span>
                    <span id="refreshLabel">刷新</span>
                </button>
                <span id="updated" class="ml-2"></span>
            </div>
        </div>
        <div class="row mt-3">
            <div class="col">
                <div class="table-responsive">
                    <table class="table table-bordered table-striped">
                        <thead>
                        <tr>
                            <th data-i18n="status.node">节点</th>
                            <th data-i18n="status.delay">延迟</th>
                            <th data-i18n="status.state">状态</th>
                        </tr>
                        </thead>
                        <tbody id="nodeBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
        <div class="row mt-2">
            <div class="col">
                <small class="text-muted">
                    Loading icon:
                    <a href="https://commons.wikimedia.org/wiki/File:Loading_icon.gif" target="_blank" rel="noopener">Ahm masum</a>
                    (CC BY-SA 4.0)
                </small>
            </div>
        </div>
    </article>
</main>

<!--装饰线条-->
<div class="hr">
    <div class="hr__centos-color-0"></div>
    <div class="hr__centos-color-1"></div>
    <div class="hr__centos-color-2"></div>
    <div class="hr__centos-color-3"></div>
</div>

<!--页脚-->
<div id="footer"></div>

<script>
    (function () {
        "use strict";

        function t(key, params) {
            return (window.i18n && typeof window.i18n.t === "function") ? window.i18n.t(key, params) : key;
        }

        var body;
        var updated;
        var refreshBtn;
        var refreshLabel;
        var spinner;
        var loading = false;
        var nodes = [];
        var updatedAt = null;

        function delayText(node) {
            if (node.delay) {
                return node.delay + " ms";
            }
            if (node.message) {
                return node.message;
            }
            return "-";
        }

        function refreshUpdated() {
            if (updatedAt) {
                updated.textContent = t("status.updated", {time: new Date(updatedAt).toLocaleString()});
            }
        }

        function setLoading(on) {
            loading = on;
            refreshBtn.disabled = on;
            spinner.hidden = !on;
            refreshLabel.textContent = on ? t("status.testing") : t("status.refresh");
        }

        function render() {
            body.innerHTML = "";
            nodes.forEach(function (node) {
                var pending = !node.delay && !node.message;
                var tr = document.createElement("tr");
                var tdName = document.createElement("td");
                tdName.textContent = node.name;
                var tdDelay = document.createElement("td");
                tdDelay.textContent = delayText(node);
                var tdState = document.createElement("td");
                var badge = document.createElement("span");
                var cls, labelKey;
                if (pending) {
                    cls = "secondary";
                    labelKey = "status.pending";
                } else if (node.reachable) {
                    cls = "success";
                    labelKey = "status.reachable";
                } else {
                    cls = "danger";
                    labelKey = "status.unreachable";
                }
                badge.className = "badge badge-" + cls;
                badge.textContent = t(labelKey);
                tdState.appendChild(badge);
                tr.appendChild(tdName);
                tr.appendChild(tdDelay);
                tr.appendChild(tdState);
                body.appendChild(tr);
            });
        }

        function fetchNodes(test) {
            var url = test ? "/status/nodes" : "/status/nodes?test=false";
            return fetch(url, {cache: "no-store"}).then(function (res) {
                if (!res.ok) {
                    throw new Error("HTTP " + res.status);
                }
                return res.json();
            });
        }

        function loadPending() {
            fetchNodes(false).then(function (data) {
                nodes = data.nodes || [];
                updatedAt = null;
                updated.textContent = "";
                render();
            }).catch(function (err) {
                updated.textContent = t("status.failed", {msg: err && err.message ? err.message : err});
            });
        }

        function runTest() {
            if (loading) {
                return;
            }
            setLoading(true);
            updated.textContent = t("status.testing");
            fetchNodes(true).then(function (data) {
                nodes = data.nodes || [];
                updatedAt = data.updatedAt || Date.now();
                render();
                refreshUpdated();
            }).catch(function (err) {
                updated.textContent = t("status.failed", {msg: err && err.message ? err.message : err});
            }).finally(function () {
                setLoading(false);
            });
        }

        function start() {
            body = document.getElementById("nodeBody");
            updated = document.getElementById("updated");
            refreshBtn = document.getElementById("refreshBtn");
            refreshLabel = document.getElementById("refreshLabel");
            spinner = document.getElementById("loadingSpinner");
            refreshBtn.addEventListener("click", runTest);
            document.addEventListener("i18n:ready", function () {
                render();
                refreshUpdated();
                setLoading(loading);
            });
            document.addEventListener("i18n:changed", function () {
                render();
                refreshUpdated();
                setLoading(loading);
            });
            setLoading(false);
            loadPending();
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", start);
        } else {
            start();
        }
    })();
</script>
</body>

</html>
