<!DOCTYPE html>

<!--语言-->
<html lang="zh-cn">

<head>
    <!--网页标题-->
    <title data-i18n="about.pageTitle">EFH - 关于</title>

    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1, shrink-to-fit=no" name="viewport"/>
    <link href="/woznes.png" rel="icon" type="image/png"/>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"/>

    <script src="/js/i18n.js" defer></script>
    <link href="/css/common.css" rel="stylesheet">
    <link href="/css/bootstrap4.centos.css" rel="stylesheet">
    <script>
        $(document).ready(function () {
            $("#footer").load("/footer.html");
            $("#navibar").load("/navibar.html");
        })
    </script>
</head>

<body>
<div id="navibar"></div>
<header class="header header__page">

    <!--logo-->
    <div class="container mb-5">
        <a href="/"></a>
    </div>

    <!--页面标题-->
    <h1 class="header__page__title" data-i18n="about.heading">
        关于 EFH
    </h1>

    <!--副标题-->
    <p class="header__page__description" data-i18n="about.subtitle">
        Escape From HDSB Project
    </p>

</header>

<!--装饰线条-->
<div class="hr">
    <div class="hr__centos-color-0"></div>
    <div class="hr__centos-color-1"></div>
    <div class="hr__centos-color-2"></div>
    <div class="hr__centos-color-3"></div>
</div>

<!--内容-->
<main class="page">
    <article class="page__content">
        <!--添加一个row来添加新的内容-->
        <!--并填充col-->
        <!--每段使用<p> -->
        <!--内容标题使用h5-->
        <!--内容副标题使用h6-->
        <!--使用<div class="alert alert-info" role="alert">创建重要信息框-->
        <!--使用<h5 class="alert-heading"></h5>作为重要标题-->
        <div class="row">
            <div class="col">
                <p data-i18n="about.intro">
                    EFH 是一群被作业和防火墙同时追着跑的学生，用课余时间搭起来的网络项目。
                </p>
            </div>
        </div>

        <div class="row mt-3">
            <div class="col-md-6">
                <h5 data-i18n="about.missionTitle">我们在做什么</h5>
                <p data-i18n="about.mission">
                    维护节点，提供稳定、低延迟的代理服务，以及各种顺手的小工具。
                </p>
            </div>
            <div class="col-md-6">
                <h5 data-i18n="about.stackTitle">技术栈</h5>
                <p data-i18n="about.stack">
                    Kotlin + Ktor、trojan-go、nginx 与 acme.sh。
                </p>
            </div>
        </div>

        <div class="row mt-3">
            <div class="col">
                <div class="alert alert-info" role="alert">
                    <h5 class="alert-heading" data-i18n="about.disclaimerTitle">免责声明</h5>
                    <p class="mb-0" data-i18n="about.disclaimer">
                        本项目仅供学习研究，请遵守当地法律法规。
                    </p>
                </div>
            </div>
        </div>
    </article>
</main>

<!--装饰线条-->
<div class="hr">
    <div class="hr__centos-color-0"></div>
    <div class="hr__centos-color-1"></div>
    <div class="hr__centos-color-2"></div>
    <div class="hr__centos-color-3"></div>
</div>

<!--页脚-->
<div id="footer"></div>
</body>

</html>
