<!DOCTYPE html>

<!--语言-->
<html lang="zh-cn">

<head>
    <!--网页标题-->
    <title data-i18n="acc.pageTitle">EFH - 网站屏蔽检测</title>

    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1, shrink-to-fit=no" name="viewport"/>
    <link href="/woznes.png" rel="icon" type="image/png"/>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"/>

    <script src="/js/i18n.js" defer></script>
    <link href="/css/common.css" rel="stylesheet">
    <link href="/css/bootstrap4.centos.css" rel="stylesheet">
    <script>
        $(document).ready(function () {
            $("#footer").load("/footer.html");
            $("#navibar").load("/navibar.html");
        })
    </script>
</head>

<body>
<div id="navibar"></div>
<header class="header header__page">

    <!--logo-->
    <div class="container mb-5">
        <a href="/static"></a>
    </div>

    <!--页面标题-->
    <h1 class="header__page__title" data-i18n="acc.heading">
        网站屏蔽检测
    </h1>

    <!--副标题-->
    <p class="header__page__description" data-i18n="acc.subtitle">
        检测 Cloudflare Radar Top 网站在当前网络下是否被 HDSB 屏蔽
    </p>

</header>

<!--装饰线条-->
<div class="hr">
    <div class="hr__centos-color-0"></div>
    <div class="hr__centos-color-1"></div>
    <div class="hr__centos-color-2"></div>
    <div class="hr__centos-color-3"></div>
</div>

<!--内容-->
<main class="page">
    <article class="page__content">
        <div class="row">
            <div class="col">
                <div class="form-row align-items-end">
                    <div class="col-auto">
                        <label for="topSelect" data-i18n="acc.list">检测列表</label>
                        <select id="topSelect" class="form-control"></select>
                    </div>
                    <div class="col-auto">
                        <label for="concurrencyInput" data-i18n="acc.concurrency">并发数</label>
                        <input id="concurrencyInput" class="form-control" type="number" min="1" max="256" value="16">
                    </div>
                    <div class="col-auto">
                        <label for="timeoutInput" data-i18n="acc.timeout">单站超时（毫秒）</label>
                        <input id="timeoutInput" class="form-control" type="number" min="1000" step="1000" value="12000">
                    </div>
                    <div class="col-auto">
                        <button id="startBtn" class="btn btn-primary" data-i18n="acc.start">开始检测</button>
                        <button id="stopBtn" class="btn btn-secondary" disabled data-i18n="acc.stop">停止</button>
                        <button id="exportBtn" class="btn btn-outline-primary" disabled data-i18n="acc.export">导出 CSV</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col">
                <div class="progress" style="height: 22px;">
                    <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated"
                         role="progressbar" style="width: 0%;">0 / 0
                    </div>
                </div>
                <p id="statusText" class="mt-2 mb-1" data-i18n="acc.ready">就绪。</p>
            </div>
        </div>

        <div class="row mt-2">
            <div class="col">
                <span class="badge badge-success"><span data-i18n="acc.badge.accessible">可访问</span> <span id="countAccessible">0</span></span>
                <span class="badge badge-danger"><span data-i18n="acc.badge.blocked">被屏蔽</span> <span id="countBlocked">0</span></span>
                <span class="badge badge-warning"><span data-i18n="acc.badge.unreachable">无法访问</span> <span id="countError">0</span></span>
                <span class="badge badge-secondary"><span data-i18n="acc.badge.timeout">超时</span> <span id="countTimeout">0</span></span>
            </div>
        </div>

        <div class="row mt-3">
            <div class="col">
                <div class="table-responsive">
                    <table class="table table-bordered table-striped table-sm">
                        <thead>
                        <tr>
                            <th data-i18n="acc.table.index">#</th>
                            <th data-i18n="acc.table.domain">域名</th>
                            <th data-i18n="acc.table.status">状态</th>
                            <th data-i18n="acc.table.detail">详情</th>
                        </tr>
                        </thead>
                        <tbody id="resultBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </article>
</main>

<!--装饰线条-->
<div class="hr">
    <div class="hr__centos-color-0"></div>
    <div class="hr__centos-color-1"></div>
    <div class="hr__centos-color-2"></div>
    <div class="hr__centos-color-3"></div>
</div>

<!--页脚-->
<div id="footer"></div>

<script>
    (function () {
        "use strict";

        var BLOCK_TEXT = "This website is blocked due to HDSB filtering rules.";
        var BUCKETS = [200, 500, 1000, 2000, 5000, 10000, 20000, 50000, 100000, 200000, 500000, 1000000];
        var STATUS_META = {
            accessible: {labelKey: "acc.badge.accessible", cls: "success", stat: "countAccessible"},
            blocked: {labelKey: "acc.badge.blocked", cls: "danger", stat: "countBlocked"},
            error: {labelKey: "acc.badge.unreachable", cls: "warning", stat: "countError"},
            timeout: {labelKey: "acc.badge.timeout", cls: "secondary", stat: "countTimeout"}
        };

        var running = false;
        var cancelled = false;
        var results = [];
        var lastStatus = {key: "acc.ready", params: null};

        var topSelect = document.getElementById("topSelect");
        var concurrencyInput = document.getElementById("concurrencyInput");
        var timeoutInput = document.getElementById("timeoutInput");
        var startBtn = document.getElementById("startBtn");
        var stopBtn = document.getElementById("stopBtn");
        var exportBtn = document.getElementById("exportBtn");
        var progressBar = document.getElementById("progressBar");
        var statusText = document.getElementById("statusText");
        var resultBody = document.getElementById("resultBody");

        BUCKETS.forEach(function (top) {
            var option = document.createElement("option");
            option.value = String(top);
            option.textContent = "Top " + formatTop(top);
            topSelect.appendChild(option);
        });

        function formatTop(top) {
            return String(top).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }

        function resetCounters() {
            Object.keys(STATUS_META).forEach(function (key) {
                document.getElementById(STATUS_META[key].stat).textContent = "0";
            });
        }

        function updateProgress(done, total) {
            var pct = total > 0 ? Math.floor(done * 100 / total) : 0;
            progressBar.style.width = pct + "%";
            progressBar.textContent = done + " / " + total + " (" + pct + "%)";
        }

        function setStatus(key, params) {
            lastStatus = {key: key, params: params || null};
            statusText.textContent = i18n.t(key, params);
        }

        function addRow(index, domain, status, detailKey, detailParams) {
            var meta = STATUS_META[status] || STATUS_META.error;
            var tr = document.createElement("tr");
            var tdIndex = document.createElement("td");
            tdIndex.textContent = String(index + 1);
            var tdDomain = document.createElement("td");
            tdDomain.textContent = domain;
            var tdStatus = document.createElement("td");
            var badge = document.createElement("span");
            badge.className = "badge badge-" + meta.cls;
            badge.textContent = i18n.t(meta.labelKey);
            tdStatus.appendChild(badge);
            var tdDetail = document.createElement("td");
            tdDetail.textContent = detailKey ? i18n.t(detailKey, detailParams) : "";
            tr.appendChild(tdIndex);
            tr.appendChild(tdDomain);
            tr.appendChild(tdStatus);
            tr.appendChild(tdDetail);
            resultBody.appendChild(tr);
        }

        function renderTable() {
            resultBody.innerHTML = "";
            results.forEach(function (item, i) {
                if (item) {
                    addRow(i, item.domain, item.status, item.detailKey, item.detailParams);
                }
            });
        }

        function bumpCounter(status) {
            var meta = STATUS_META[status] || STATUS_META.error;
            var el = document.getElementById(meta.stat);
            el.textContent = String(parseInt(el.textContent, 10) + 1);
        }

        // 不依据 SSL 判定，只读取页面正文并匹配 HDSB 屏蔽提示。
        // 页面由用户浏览器本地发起请求，反映本地网络/拦截的真实情况。
        function probe(domain, timeoutMs) {
            var url = "https://" + domain + "/";
            var controller = new AbortController();
            var timer = setTimeout(function () {
                controller.abort();
            }, timeoutMs);
            return fetch(url, {
                mode: "cors",
                cache: "no-store",
                redirect: "follow",
                signal: controller.signal
            }).then(function (res) {
                return res.text();
            }).then(function (text) {
                if (text.indexOf(BLOCK_TEXT) !== -1) {
                    return {status: "blocked", detailKey: "acc.blockedDetail"};
                }
                return {status: "accessible", detailKey: "acc.accessibleDetail"};
            }).catch(function (err) {
                if (err && err.name === "AbortError") {
                    return {status: "timeout", detailKey: "acc.timeoutDetail", detailParams: {n: timeoutMs}};
                }
                return {status: "error", detailKey: "acc.unreachableDetail"};
            }).finally(function () {
                clearTimeout(timer);
            });
        }

        function runPool(items, concurrency, worker) {
            var index = 0;
            var active = Math.max(1, Math.min(concurrency, items.length));
            var runners = [];
            for (var w = 0; w < active; w++) {
                runners.push((function loop() {
                    var current = index++;
                    if (cancelled || current >= items.length) {
                        return Promise.resolve();
                    }
                    return worker(items[current], current).then(loop);
                })());
            }
            return Promise.all(runners);
        }

        function setRunning(value) {
            running = value;
            startBtn.disabled = value;
            stopBtn.disabled = !value;
            exportBtn.disabled = value || results.length === 0;
        }

        startBtn.addEventListener("click", function () {
            if (running) {
                return;
            }
            var top = topSelect.value;
            var concurrency = parseInt(concurrencyInput.value, 10);
            var timeoutMs = parseInt(timeoutInput.value, 10);
            if (!(concurrency > 0)) {
                concurrency = 16;
            }
            if (!(timeoutMs > 0)) {
                timeoutMs = 12000;
            }

            cancelled = false;
            results = [];
            resultBody.innerHTML = "";
            resetCounters();
            updateProgress(0, 0);
            setRunning(true);
            setStatus("acc.loading", {top: formatTop(parseInt(top, 10))});

            var finished = 0;
            fetch("/top-domains/" + top, {cache: "no-store"}).then(function (res) {
                if (!res.ok) {
                    return res.text().then(function (body) {
                        throw new Error("HTTP " + res.status + ": " + body);
                    });
                }
                return res.text();
            }).then(function (text) {
                var domains = text.split("\n").map(function (line) {
                    return line.trim();
                }).filter(function (line) {
                    return line.length > 0;
                });
                if (domains.length === 0) {
                    throw new Error(i18n.t("acc.empty"));
                }
                setStatus("acc.loaded", {n: domains.length});
                updateProgress(0, domains.length);

                return runPool(domains, concurrency, function (domain, i) {
                    if (cancelled) {
                        return Promise.resolve();
                    }
                    return probe(domain, timeoutMs).then(function (result) {
                        results[i] = {domain: domain, status: result.status, detailKey: result.detailKey, detailParams: result.detailParams};
                        addRow(i, domain, result.status, result.detailKey, result.detailParams);
                        bumpCounter(result.status);
                        finished++;
                        updateProgress(finished, domains.length);
                    });
                });
            }).then(function () {
                if (cancelled) {
                    setStatus("acc.stopped", {n: finished});
                } else {
                    setStatus("acc.done", {n: finished});
                }
                setRunning(false);
            }).catch(function (err) {
                setStatus("acc.error", {msg: (err && err.message ? err.message : err)});
                setRunning(false);
            });
        });

        stopBtn.addEventListener("click", function () {
            cancelled = true;
            setStatus("acc.stopping");
        });

        exportBtn.addEventListener("click", function () {
            var rows = [["domain", "status", "detail"]];
            results.forEach(function (item) {
                if (item) {
                    rows.push([item.domain, item.status, item.detailKey ? i18n.t(item.detailKey, item.detailParams) : ""]);
                }
            });
            var csv = rows.map(function (row) {
                return row.map(function (cell) {
                    return '"' + String(cell).replace(/"/g, '""') + '"';
                }).join(",");
            }).join("\n");
            var blob = new Blob([csv], {type: "text/csv;charset=utf-8"});
            var link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "accessibility-top" + topSelect.value + ".csv";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
        });

        document.addEventListener("i18n:changed", function () {
            renderTable();
            setStatus(lastStatus.key, lastStatus.params);
        });

        setRunning(false);
        updateProgress(0, 0);
    })();
</script>
</body>

</html>
