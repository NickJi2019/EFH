name: Client Release (Windows / Linux)

# Builds the client's single-file Windows installer and Linux AppImage and
# attaches them to an existing GitHub release. macOS (a .dmg) is built locally
# with packaging/macos/make_dmg.sh; Windows and Linux cannot be cross-compiled
# from macOS.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, e.g. v1.1.6'
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
      - uses: subosito/flutter-action@v2
        with:
          # A concrete version keeps the build reproducible.
          flutter-version: '3.47.4'
          cache: true
      - name: Build
        working-directory: efh_connectivity_test
        run: |
          flutter pub get
          flutter build windows --release
      - name: Package (single .exe)
        working-directory: efh_connectivity_test
        shell: pwsh
        run: |
          $ver = '${{ inputs.version }}'
          $iscc = (Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1).FullName
          if (-not $iscc) { $iscc = 'iscc' }
          $src = (Resolve-Path 'build\windows\x64\runner\Release').Path
          $out = (Resolve-Path '..').Path
          & $iscc "/DAppVersion=$ver" "/DSourceDir=$src" "/DOutDir=$out" 'packaging\windows\EFH.iss'
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          prerelease: false
          files: EFH-${{ inputs.version }}-windows-setup.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          cache: true
      - name: Build
        working-directory: efh_connectivity_test
        run: |
          flutter pub get
          flutter build linux --release
      - name: Package (single AppImage)
        working-directory: efh_connectivity_test
        run: |
          bash packaging/linux/make_appimage.sh "${{ inputs.version }}"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          prerelease: false
          files: EFH-${{ inputs.version }}-linux-x86_64.AppImage
